name: Release Gostlings CLI & Exercises

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact_name: gostlings-windows-amd64
            binary_name: gostlings.exe
          - goos: darwin
            goarch: amd64
            artifact_name: gostlings-darwin-amd64
            binary_name: gostlings
          - goos: darwin
            goarch: arm64
            artifact_name: gostlings-darwin-arm64
            binary_name: gostlings
          - goos: linux
            goarch: amd64
            artifact_name: gostlings-linux-amd64
            binary_name: gostlings

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: cli/go.sum

      - name: Build Gostlings Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          cd cli
          go build -ldflags="-s -w" -o ../dist/${{ matrix.binary_name }} .

      - name: Prepare Release Package
        run: |
          mkdir -p package/${{ matrix.artifact_name }}
          cp dist/${{ matrix.binary_name }} package/${{ matrix.artifact_name }}/
          cp -r exercises package/${{ matrix.artifact_name }}/
          cp -r content package/${{ matrix.artifact_name }}/
          cd package
          zip -r ../${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }}

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.zip
